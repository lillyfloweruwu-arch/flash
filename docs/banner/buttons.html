<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Antonio'; src: url('../../assets/fonts/antonio.woff2') format('woff2'); font-weight: 100 700; }
html, body { margin: 0; background: #0a0a0b; }
.btn {
  box-sizing: border-box; width: 600px; height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: 'Antonio', 'Arial Narrow', sans-serif; text-transform: uppercase; border-radius: 8px; padding: 0 32px;
}
.main { font-size: 40px; font-weight: 700; letter-spacing: 5px; line-height: 1.1; white-space: nowrap; }
.sub { font-size: 22px; letter-spacing: 4px; margin-top: 6px; }
#win { background: #e8192c; color: #fff; }
#win .sub { color: #fff; }
#lin { background: #121316; color: #f2f3f5; border: 2px solid #e8192c; }
#lin .sub { color: #9aa0ab; }
</style></head>
<body>
<div class="btn" id="win"><div class="main">Download for Windows</div><div class="sub">Installer &middot; .exe</div></div>
<div class="btn" id="lin"><div class="main">Download for Linux</div><div class="sub">AppImage &middot; experimental</div></div>
<script>
  const which = location.hash.slice(1)
  if (which) for (const id of ['win', 'lin']) if (id !== which) document.getElementById(id).remove()
</script>
</body></html>
