<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Antonio'; src: url('../../assets/fonts/antonio.woff2') format('woff2'); font-weight: 100 700; }
html, body { margin: 0; width: 1280px; height: 400px; background: #0a0a0b; overflow: hidden; }
.wrap {
  position: relative; width: 1280px; height: 400px; box-sizing: border-box;
  background:
    radial-gradient(ellipse 620px 360px at 18% 50%, rgba(232,25,44,0.20), transparent 70%),
    #0a0a0b;
  border-bottom: 2px solid #e8192c;
  font-family: 'Antonio', 'Arial Narrow', sans-serif; color: #f2f3f5;
}
.icon { position: absolute; left: 96px; top: 96px; width: 208px; height: 208px; filter: drop-shadow(0 12px 40px rgba(232,25,44,0.45)); }
.name { position: absolute; left: 352px; top: 52px; font-size: 168px; line-height: 1; font-weight: 700; letter-spacing: 6px; }
.tag { position: absolute; left: 356px; top: 250px; font-size: 30px; letter-spacing: 7px; color: #9aa0ab; text-transform: uppercase; }
.btn {
  position: absolute; left: 356px; top: 310px; height: 56px; width: 380px; box-sizing: border-box; padding: 0 24px; justify-content: center; display: flex; align-items: center;
  background: #e8192c; color: #fff; font-size: 26px; letter-spacing: 5px; text-transform: uppercase; border-radius: 4px;
}
.sub { position: absolute; left: 770px; top: 322px; font-size: 22px; letter-spacing: 4px; color: #9aa0ab; text-transform: uppercase; }
</style></head>
<body><div class="wrap">
  <img class="icon" src="../../assets/icons/blood.png">
  <div class="name">FLASH</div>
  <div class="tag">Game clipper &middot; Windows &amp; Linux beta</div>
  <div class="btn">Download latest beta</div>
  <div class="sub">Free &middot; Open source</div>
</div></body></html>
